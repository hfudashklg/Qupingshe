<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 变量与交互示例</title>
</head>
<body>
    <h1>订单信息输入</h1>
    
    <!-- 输入区域 -->
    <div>
        <label>商品名称: <input type="text" id="product"></label><br>
        <label>数量: <input type="number" id="quantity"></label><br>
        <label>价格: <input type="number" id="price"></label><br>
        <button onclick="processOrder()">提交订单</button>
    </div>
    
    <!-- 输出区域 -->
    <div id="output" style="margin-top:20px; padding:10px; border:1px solid #ccc;"></div>

    <script>
        // 声明常量（不可重新赋值）
        const TAX_RATE = 0.08;
        
        function processOrder() {
            // 声明变量（可重新赋值）
            let product = document.getElementById('product').value;
            let quantity = parseInt(document.getElementById('quantity').value);
            let price = parseFloat(document.getElementById('price').value);
            
            // 计算总价
            let subtotal = quantity * price;
            let tax = subtotal * TAX_RATE;
            let total = subtotal + tax;
            
            // 输出结果到页面
            document.getElementById('output').innerHTML = `
                <h3>订单详情:</h3>
                <p>商品: ${product}</p>
                <p>数量: ${quantity}</p>
                <p>单价: ¥${price.toFixed(2)}</p>
                <p>小计: ¥${subtotal.toFixed(2)}</p>
                <p>税费(8%): ¥${tax.toFixed(2)}</p>
                <p><strong>总计: ¥${total.toFixed(2)}</strong></p>
            `;
            
            // 同时在控制台输出
            console.log("订单处理完成:", {product, quantity, price, total});
        }
    </script>
</body>
</html>
